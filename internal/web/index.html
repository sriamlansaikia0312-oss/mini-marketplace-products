<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini marketplace — products</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --fg: #e6edf3;
      --dim: #8b9cb3;
      --link: #58a6ff;
      --line: #2d3a4d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
    }
    header {
      padding: 1.25rem 1.5rem;
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 1.25rem; }
    header p { margin: 0.25rem 0 0; color: var(--dim); font-size: 0.875rem; }
    main { max-width: 56rem; margin: 0 auto; padding: 1.5rem; }
    #msg { margin: 0 0 1rem; font-size: 0.875rem; color: var(--dim); }
    #msg.err { color: #f85149; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td { padding: 0.65rem 1rem; text-align: left; }
    th {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--dim);
      background: #243044;
    }
    tbody tr:nth-child(even) { background: #243044; }
    tbody tr { cursor: pointer; }
    tbody tr:focus-visible { outline: 2px solid var(--link); outline-offset: -2px; }
    .tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .tag.aws { background: #232f3e; color: #ff9900; }
    .tag.azure { background: #0078d4; color: #fff; }
    .tag.gcp { background: #1a73e8; color: #fff; }
    code { color: var(--link); font-size: 0.85em; }
    #panel {
      display: none;
      margin-top: 1.25rem;
      padding: 1rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    #panel.open { display: block; }
    #panel h2 { margin: 0 0 0.5rem; font-size: 1rem; }
    #panel dl { margin: 0; display: grid; grid-template-columns: 5rem 1fr; gap: 0.25rem 1rem; }
    #panel dt { color: var(--dim); }
    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.8rem;
      color: var(--dim);
    }
    footer a { color: var(--link); }
  </style>
</head>
<body>
  <header>
    <h1>Mini marketplace</h1>
    <p>NetApp-style listings (in-memory demo)</p>
  </header>
  <main>
    <p id="msg" role="status">Loading…</p>
    <table id="grid" hidden>
      <thead>
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Name</th>
          <th scope="col">Cloud</th>
          <th scope="col">SKU</th>
          <th scope="col">Family</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <section id="panel" aria-labelledby="ph">
      <h2 id="ph">Detail</h2>
      <dl id="fields"></dl>
    </section>
  </main>
  <footer>
    <a href="/api/products">/api/products</a>
    ·
    <a href="/api/health">/api/health</a>
  </footer>
  <script>
(function () {
  var msg = document.getElementById("msg");
  var grid = document.getElementById("grid");
  var rows = document.getElementById("rows");
  var panel = document.getElementById("panel");
  var fields = document.getElementById("fields");

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function rowClick(id) {
    panel.classList.add("open");
    fields.innerHTML = "<dt>…</dt><dd>Loading</dd>";
    fetch("/api/products/" + encodeURIComponent(id))
      .then(function (r) { return r.json(); })
      .then(function (p) {
        if (p.error) {
          fields.innerHTML = "<dt>Error</dt><dd>" + esc(p.error) + "</dd>";
          return;
        }
        fields.innerHTML = ["id", "name", "cloud", "sku", "family"].map(function (k) {
          var v = p[k] != null ? String(p[k]) : "—";
          return "<dt>" + esc(k) + "</dt><dd>" + esc(v) + "</dd>";
        }).join("");
      })
      .catch(function (e) {
        fields.innerHTML = "<dt>Error</dt><dd>" + esc(e.message) + "</dd>";
      });
  }

  fetch("/api/products")
    .then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })
    .then(function (list) {
      msg.textContent = list.length + " products";
      msg.classList.remove("err");
      rows.innerHTML = list.map(function (p) {
        return (
          "<tr tabindex=\"0\" data-id=\"" + esc(p.id) + "\">" +
          "<td><code>" + esc(p.id) + "</code></td>" +
          "<td>" + esc(p.name) + "</td>" +
          "<td><span class=\"tag " + esc(p.cloud) + "\">" + esc(p.cloud) + "</span></td>" +
          "<td><code>" + esc(p.sku) + "</code></td>" +
          "<td>" + esc(p.family || "—") + "</td>" +
          "</tr>"
        );
      }).join("");
      grid.hidden = false;
      rows.querySelectorAll("tr").forEach(function (tr) {
        var id = tr.getAttribute("data-id");
        tr.addEventListener("click", function () { rowClick(id); });
        tr.addEventListener("keydown", function (ev) {
          if (ev.key === "Enter" || ev.key === " ") {
            ev.preventDefault();
            rowClick(id);
          }
        });
      });
    })
    .catch(function (e) {
      msg.textContent = "Failed: " + e.message;
      msg.classList.add("err");
    });
})();
  </script>
</body>
</html>
